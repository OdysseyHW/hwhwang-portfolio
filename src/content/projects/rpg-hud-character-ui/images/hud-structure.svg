<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="1600" height="900" fill="#14161a"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a5f68"/></marker></defs><text x="60" y="80" font-size="34" fill="#e8eaee" font-weight="800">정보 구조 · 우선순위 (샘플)</text><text x="60" y="120" font-size="20" fill="#a9adb5" >전투 중 시선 이동 거리를 기준으로 정보를 4단계로 나눈 와이어프레임</text><rect x="60" y="170" width="340" height="60" fill="#d9534f" rx="8" fill-opacity="0.18" stroke="#d9534f"/><text x="80" y="209" font-size="22" fill="#e8eaee" font-weight="700">1순위 · 생존</text><rect x="60" y="250" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="80" y="286" font-size="20" fill="#e8eaee" >HP / MP</text><rect x="60" y="324" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="80" y="360" font-size="20" fill="#e8eaee" >위험 경고</text><rect x="60" y="398" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="80" y="434" font-size="20" fill="#e8eaee" >스킬 쿨다운</text><path d="M405 200 h25" stroke="#5a5f68" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="170" width="340" height="60" fill="#f2b84b" rx="8" fill-opacity="0.18" stroke="#f2b84b"/><text x="460" y="209" font-size="22" fill="#e8eaee" font-weight="700">2순위 · 행동</text><rect x="440" y="250" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="460" y="286" font-size="20" fill="#e8eaee" >스킬바</text><rect x="440" y="324" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="460" y="360" font-size="20" fill="#e8eaee" >대상 정보</text><rect x="440" y="398" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="460" y="434" font-size="20" fill="#e8eaee" >상호작용 안내</text><path d="M785 200 h25" stroke="#5a5f68" stroke-width="2" marker-end="url(#a)"/><rect x="820" y="170" width="340" height="60" fill="#4a90d9" rx="8" fill-opacity="0.18" stroke="#4a90d9"/><text x="840" y="209" font-size="22" fill="#e8eaee" font-weight="700">3순위 · 목표</text><rect x="820" y="250" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="840" y="286" font-size="20" fill="#e8eaee" >퀘스트 목표</text><rect x="820" y="324" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="840" y="360" font-size="20" fill="#e8eaee" >미니맵 표식</text><path d="M1165 200 h25" stroke="#5a5f68" stroke-width="2" marker-end="url(#a)"/><rect x="1200" y="170" width="340" height="60" fill="#8a8f98" rx="8" fill-opacity="0.18" stroke="#8a8f98"/><text x="1220" y="209" font-size="22" fill="#e8eaee" font-weight="700">4순위 · 참고</text><rect x="1200" y="250" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="1220" y="286" font-size="20" fill="#e8eaee" >버프 상세</text><rect x="1200" y="324" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="1220" y="360" font-size="20" fill="#e8eaee" >채팅</text><rect x="1200" y="398" width="340" height="58" fill="#1d2026" rx="6" stroke="#3a3f47"/><text x="1220" y="434" font-size="20" fill="#e8eaee" >시간·구역</text><rect x="60" y="520" width="1480" height="320" fill="#101216" rx="10" stroke="#3a3f47" stroke-dasharray="8 6"/><text x="80" y="556" font-size="18" fill="#a9adb5" >화면 배치 와이어프레임</text><rect x="90" y="580" width="260" height="80" fill="none" stroke="#d9534f" stroke-width="2"/><text x="110" y="626" font-size="18" fill="#d9534f" >상태</text><rect x="640" y="580" width="320" height="50" fill="none" stroke="#f2b84b" stroke-width="2"/><text x="660" y="612" font-size="18" fill="#f2b84b" >대상 정보</text><circle cx="1420" cy="640" r="60" fill="none" stroke="#4a90d9" stroke-width="2"/><text x="1385" y="646" font-size="18" fill="#4a90d9" >미니맵</text><rect x="1280" y="720" width="230" height="80" fill="none" stroke="#4a90d9" stroke-width="2"/><text x="1300" y="766" font-size="18" fill="#4a90d9" >퀘스트</text><rect x="560" y="730" width="480" height="80" fill="none" stroke="#f2b84b" stroke-width="2"/><text x="580" y="776" font-size="18" fill="#f2b84b" >스킬바 (중앙 하단 고정)</text>
<g opacity="0.9"><rect x="1410" y="842" width="170" height="38" rx="4" fill="#000" fill-opacity="0.55" stroke="#f2b84b" stroke-dasharray="6 4"/>
