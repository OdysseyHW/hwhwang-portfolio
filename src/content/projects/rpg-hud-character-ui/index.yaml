# 샘플 프로젝트 — 실제 작업물로 교체하세요. (모든 항목 사용 예시)
title: RPG 전투 HUD · 캐릭터 정보 UI
summary: 전투 중 꼭 필요한 정보만 빠르게 읽히도록 HUD의 정보 우선순위와 배치를 다시 정리한 샘플 프로젝트입니다.
sample: true
projectType: 개인 콘셉트 (샘플)
genre: 액션 RPG
platform: PC
period: "기간 입력 (예: 4주)"
teamType: 개인 작업
roles:
  - UX 설계
  - HUD 디자인
  - 아이콘 제작
contribution: |
  [샘플 문구] 실제 프로젝트라면 이 영역에 직접 제작한 범위를 구체적으로 적습니다.

  - 정보 구조와 화면 배치 와이어프레임
  - HUD 전체 화면과 스킬 슬롯·상태 바 컴포넌트
  - 상태별 아이콘과 모션 가이드
coverImage: ./images/cover.svg
coverAlt: 캐릭터 상태, 미니맵, 퀘스트 목표, 하단 스킬바가 배치된 RPG 전투 HUD 샘플 화면
coverPosition: 50% 50%
tags: [HUD, 정보 구조, 컴포넌트]
featured: true
order: 1
sections:
  - title: 디자인 목표와 문제 정의
    body: |
      [샘플 문구] 전투 중 플레이어는 화면 중앙의 캐릭터와 적을 주로 봅니다. 화면 가장자리에 흩어진 정보를 확인하려면 시선이 크게 움직여야 하고, 위험 상황을 늦게 알아차리는 문제가 생길 수 있다고 가정했습니다.

      - 생존과 직결된 정보(HP, 위험 경고, 쿨다운)를 가장 먼저 읽히게 한다
      - 같은 종류의 정보는 한곳에 모아 시선 이동을 줄인다
      - 색상만으로 상태를 구분하지 않는다
  - title: UX 흐름과 정보 구조
    body: |
      [샘플 문구] 정보를 생존·행동·목표·참고 네 단계로 나누고, 단계가 높을수록 화면 중앙 하단과 가까운 위치에 두는 원칙으로 와이어프레임을 구성했습니다.
    images:
      - src: ./images/hud-structure.svg
        alt: 정보를 생존, 행동, 목표, 참고 네 단계로 나눈 표와 화면 배치 와이어프레임
        title: 정보 우선순위와 배치 와이어프레임
        caption: 우선순위가 높은 정보를 시선이 머무는 중앙 하단에 가깝게 배치했습니다.
  - title: 최종 UI와 주요 컴포넌트
    body: |
      [샘플 문구] 최종 화면에서는 상태 정보를 좌상단에, 행동 정보를 중앙 하단 스킬바에 모았습니다. 스킬 슬롯과 HP 바는 상태별 규칙을 정의해 다른 화면에서도 재사용할 수 있게 정리했습니다.
    images:
      - src: ./images/hud-final.svg
        alt: 1920×1080 해상도의 최종 RPG 전투 HUD 샘플 화면
        title: 최종 HUD 전체 화면 (1920×1080)
        layout: full
      - src: ./images/detail-skill-states.svg
        alt: 사용 가능, 쿨다운, 자원 부족, 강조, 잠김, 누르는 중 여섯 가지 스킬 슬롯 상태
        title: 스킬 슬롯 상태 정의
        caption: 쿨다운은 남은 시간 숫자와 어두운 부채꼴로 함께 표시합니다.
        layout: detail
      - src: ./images/detail-hp-bar.svg
        alt: HP 비율에 따라 색상, 테두리, 경고 아이콘이 달라지는 HP 바 네 가지 단계
        title: HP 바 구간별 표현
        caption: 위험 구간은 색상 외에 아이콘과 테두리로도 구분합니다.
        layout: detail
  - title: 인터랙션 영상
    video:
      src: videos/rpg-hud-interaction.webm
      poster: ./images/hud-final.svg
      posterAlt: RPG 전투 HUD 인터랙션 영상 미리보기
      title: 스킬 쿨다운과 HP 경고 연출 (샘플 영상, 소리 없음)
      caption: 영상은 재생 버튼을 눌렀을 때만 불러옵니다.
  - title: 결과와 회고
    body: |
      [샘플 문구] 실제 프로젝트라면 이 영역에 결과(사용성 테스트에서 확인한 점, 팀 피드백 등)와 다음에 개선하고 싶은 점을 사실 그대로 적습니다. 확인하지 않은 성과 수치는 적지 않습니다.
