<text x="40" y="60" font-size="28" fill="#e8eaee" font-weight="800">알림 배지 규칙</text><rect x="40" y="120" width="100" height="100" fill="#1d2433" rx="8" stroke="#3a4a6a" stroke-width="2"/><circle cx="134" cy="128" r="12" fill="#d9534f" stroke="#141a26" stroke-width="3"/><text x="180" y="162" font-size="24" fill="#e8eaee" font-weight="700">점 배지</text><text x="180" y="198" font-size="20" fill="#a9adb5" >확인하지 않은 신규 항목</text><rect x="40" y="270" width="100" height="100" fill="#1d2433" rx="8" stroke="#3a4a6a" stroke-width="2"/><rect x="108" y="260" width="54" height="32" fill="#d9534f" rx="16" stroke="#141a26" stroke-width="3"/><text x="135" y="283" font-size="18" fill="#fff" text-anchor="middle" font-weight="800">12</text><text x="180" y="312" font-size="24" fill="#e8eaee" font-weight="700">숫자 배지</text><text x="180" y="348" font-size="20" fill="#a9adb5" >수령 가능한 보상 개수 (99+ 상한)</text><rect x="40" y="420" width="100" height="100" fill="#1d2433" rx="8" stroke="#3a4a6a" stroke-width="2"/><circle cx="134" cy="428" r="16" fill="#f2b84b" stroke="#141a26" stroke-width="3"/><text x="134" y="435" font-size="20" fill="#15130f" text-anchor="middle" font-weight="800">!</text><text x="180" y="462" font-size="24" fill="#e8eaee" font-weight="700">느낌표</text><text x="180" y="498" font-size="20" fill="#a9adb5" >조치가 필요한 상태 (예: 가방 가득 참)</text>
<g opacity="0.9"><rect x="710" y="542" width="170" height="38" rx="4" fill="#000" fill-opacity="0.55" stroke="#f2b84b" stroke-dasharray="6 4"/>
