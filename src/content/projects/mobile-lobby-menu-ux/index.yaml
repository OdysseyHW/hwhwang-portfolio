  - title: 디자인 목표와 문제 정의
    body: |
      [샘플 문구] 로비에 진입점이 많아질수록 매일 하는 행동(편성 확인 → 전투 시작)을 찾기 어려워진다는 가정에서 출발했습니다.

      - 핵심 루프는 로비에서 두 번의 터치 안에 시작한다
      - 보조 기능은 하단 탭과 더보기 시트로 모은다
      - 알림 배지의 종류와 의미를 규칙으로 정한다
